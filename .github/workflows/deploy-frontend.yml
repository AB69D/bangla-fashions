name: Deploy to Vercel (production)

# This workflow lives in the repository-root .github/workflows/ because that is the
# only place GitHub Actions looks for workflows. It used to sit in frontend/.github/,
# from back when the storefront was its own repository, where it never ran.
#
# Repo secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) do NOT carry over
# from the old repository — set them on THIS repo under
# Settings → Secrets and variables → Actions before the first deploy.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The Vercel CLI treats its working directory as the project root, so every
      # vercel step runs inside frontend/ — the same directory it saw back when the
      # storefront was a standalone repo. vercel pull writes frontend/.vercel/,
      # and vercel build writes frontend/.vercel/output for the deploy step.
      - name: Pull Vercel project settings
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        working-directory: ./frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        working-directory: ./frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
